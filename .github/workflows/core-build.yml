name: Core build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['core/**', 'scripts/core-build.mjs', 'tests/citrus-core.test.mjs', '.github/workflows/core-build.yml']
  push:
    branches: [main]
    paths: ['core/**', 'scripts/core-build.mjs', 'tests/citrus-core.test.mjs', '.github/workflows/core-build.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core Go version
        id: go
        run: echo "version=$(awk '$1 == "golang" { print $2 }' core/citrus/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Citrus native TLS, config and provider tests
        env:
          SKIP_INTEROP_TEST: '1'
        run: node scripts/core-build.mjs --test-only
      - name: Artifact integrity regression
        run: node --test tests/citrus-core.test.mjs

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        target: [windows-amd64, windows-arm64, darwin-amd64, darwin-arm64, linux-amd64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Core Go version
        id: go
        run: echo "version=$(awk '$1 == "golang" { print $2 }' core/citrus/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/core-build.mjs out ${{ matrix.target }} --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: core-part-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  dist:
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: core-part-*
          path: parts
      - name: Assemble and verify every pinned Citrus target
        run: |
          mkdir -p dist
          first=""
          for d in parts/core-part-*; do
            cp "$d"/citrus-* dist/
            cat "$d/SHA256SUMS" >> sums.tmp
            if [ -z "$first" ]; then first="$d/BUILDINFO.txt"; elif ! cmp -s "$first" "$d/BUILDINFO.txt"; then echo "Build provenance differs"; exit 1; fi
          done
          cp "$first" dist/BUILDINFO.txt
          sort -k2 sums.tmp > dist/SHA256SUMS
          node --input-type=module -e "import {readManifest,verifyBuiltCore} from './scripts/core-build.mjs'; for (const t of Object.keys(readManifest().assets)) verifyBuiltCore('dist',t)"
          chmod +x dist/citrus-linux-amd64
      - name: Native controller interoperability
        env:
          CITRUS_TEST_BIN: ${{ github.workspace }}/dist/citrus-linux-amd64
        run: node --test tests/citrus-core.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
